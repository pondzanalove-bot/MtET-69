<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัว - ชยทัต</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f0f4f8; /* สีพื้นหลังสบายตา */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .profile-card {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 350px;
            width: 100%;
            text-align: center;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3498db; /* กรอบรูปสีฟ้า */
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .student-id {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .info-list {
            text-align: left;
            list-style-type: none;
            padding: 0;
            margin-bottom: 30px;
        }
        .info-list li {
            padding: 10px 0;
            border-bottom: 1px solid #ecf0f1;
            color: #34495e;
            font-size: 15px;
        }
        .info-list li:last-child {
            border-bottom: none;
        }
        .info-list strong {
            color: #2c3e50;
            display: inline-block;
            width: 90px;
        }
        .link-btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.2s;
        }
        .link-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="pond.jpg" alt="รูปโปรไฟล์ของชยทัต" class="profile-img">
        
        <h1>นาย ชยทัต ตรีรัตน์ตระกูล</h1>
        <div class="student-id">รหัสนักศึกษา: 6600801528027</div>

        <ul class="info-list">
            <li><strong>สาขา:</strong> MtET</li>
            <li><strong>อายุ:</strong> 21 ปี</li>
            <li><strong>ส่วนสูง:</strong> 175 ซม.</li>
            <li><strong>น้ำหนัก:</strong> 62 กก.</li>
        </ul>

        <a href="https://www.facebook.com/chayatast.treerattakul/?locale=th_TH" target="_blank" class="link-btn">ติดต่อ / ลิงก์เพิ่มเติม</a>
    </div>

</body>
</html>
